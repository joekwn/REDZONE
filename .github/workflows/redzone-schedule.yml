# Calls the REDZONE website on a schedule, because Vercel's free plan only allows
# one scheduled run per day. Needs two repository secrets (Settings > Secrets and
# variables > Actions):  REDZONE_URL (e.g. https://redzone.vercel.app) and CRON_SECRET.
name: REDZONE schedule
on:
  schedule:
    - cron: "7 */3 * * *"     # new FIRMS data every 3 hours
    - cron: "37 * * * *"      # event checks every hour
  workflow_dispatch:          # "Run workflow" button: runs an update now
jobs:
  call:
    if: github.repository == 'joekwn/REDZONE' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Call the website
        env:
          SITE: ${{ secrets.REDZONE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WHICH: ${{ github.event.schedule == '37 * * * *' && 'events' || 'update' }}
        run: |
          if [ -z "$SITE" ] || [ -z "$CRON_SECRET" ]; then
            echo "Not configured (REDZONE_URL / CRON_SECRET secrets missing) - nothing to do."; exit 0
          fi
          curl -fsS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "${SITE%/}/api/cron/$WHICH"
          echo
